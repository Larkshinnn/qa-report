name: qa-report
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qa_report
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: qa_report
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - qa_report_postgres_data:/var/lib/postgresql/data
volumes:
  qa_report_postgres_data:
